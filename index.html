<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=./site/">
    <title>ArborGraph — Redirecting...</title>
    <link rel="canonical" href="./site/">
    <link rel="icon" type="image/svg+xml" href="./site/assets/logo.svg">
    <script>
        (function() {
            var target = "./site/" + (window.location.hash || "");
            window.location.replace(target);
        })();
    </script>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Tahoma, Arial, sans-serif;
            background-color: #ffffff;
            color: #1f2328;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
            text-align: center;
        }
        .redirect-box {
            max-width: 480px;
            border: 1px solid #d0d7de;
            border-radius: 2px;
            padding: 32px;
            background-color: #f6f8fa;
        }
        h1 {
            font-size: 20px;
            margin: 0 0 12px 0;
            color: #003660;
        }
        p {
            font-size: 14px;
            color: #57606a;
            margin: 0 0 20px 0;
            line-height: 1.5;
        }
        a.btn {
            display: inline-block;
            background-color: #0066cc;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 18px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 2px;
        }
        a.btn:hover {
            background-color: #005a9e;
        }
    </style>
</head>
<body>
    <div class="redirect-box">
        <h1>ArborGraph</h1>
        <p>Loading the official filesystem analytics and visualization portal...</p>
        <p>If you are not redirected automatically, please click below:</p>
        <a class="btn" href="./site/">Open ArborGraph</a>
    </div>
</body>
</html>
