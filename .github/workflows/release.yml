name: Release ArborGraph

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.1.4)'
        required: false
        default: ''
      publish:
        description: 'Publish release to GitHub Releases (set false for dry-run verification)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    name: Build, Verify & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve Release Tag & Version
        id: version_info
        shell: pwsh
        run: |
          $isPublish = "${{ github.event.inputs.publish }}" -eq "true"
          $tag = "${{ github.event.inputs.tag }}"
          if ($tag -and -not $tag.StartsWith("v")) {
            $tag = "v$tag"
          }
          if (-not $tag) {
            if ($env:GITHUB_EVENT_NAME -eq "push") {
              $tag = "${{ github.ref_name }}"
            } elseif ($isPublish) {
              throw "A valid release tag (e.g. v1.1.4) is required when triggering manual publication (publish: true)."
            } else {
              # For dry-run packaging, derive target version from DiskScope.csproj
              [xml]$xml = Get-Content DiskScope.csproj
              $ver = $xml.Project.PropertyGroup.Version
              $tag = "v$ver"
            }
          }
          $cleanVersion = $tag.TrimStart('v', 'V')
          Write-Host "Resolved release tag: $tag (Version: $cleanVersion)"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$cleanVersion" >> $env:GITHUB_OUTPUT

      - name: Restore Project Dependencies
        run: |
          dotnet restore DiskScope.csproj
          dotnet restore tests/DiskScope.Tests.csproj

      - name: Build Application & Test Suites
        run: |
          dotnet build DiskScope.csproj -c Release --no-restore
          dotnet build tests/DiskScope.Tests.csproj -c Release --no-restore

      - name: Run 40-Stage Automated QA Regression Suite
        run: |
          dotnet run --project tests/DiskScope.Tests.csproj -c Release --no-build

      - name: Run Security & Data-Safety Audits
        run: |
          dotnet run --project tests/DiskScope.Tests.csproj -c Release --no-build -- --security

      - name: Publish Standalone Binary (win-x64)
        run: |
          dotnet publish DiskScope.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true -o dist/publish

      - name: Install Inno Setup Compiler
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup --no-progress --yes
            $innoPath = "C:\Program Files (x86)\Inno Setup 6"
            if (Test-Path $innoPath) {
              Write-Host "Adding $innoPath to GITHUB_PATH"
              "$innoPath" >> $env:GITHUB_PATH
              $env:PATH = "$innoPath;$env:PATH"
            }
          }
          $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $isccCmd -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $env:PATH = "C:\Program Files (x86)\Inno Setup 6;$env:PATH"
            $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
          }
          if ($isccCmd) {
            Write-Host "Inno Setup compiler verified at: $($isccCmd.Source)"
          } else {
            throw "Inno Setup compiler (iscc) not found after installation."
          }

      - name: Compile Windows Installer Package
        shell: pwsh
        run: |
          $ver = "${{ steps.version_info.outputs.version }}"
          $tag = "${{ steps.version_info.outputs.tag }}"
          $publishDir = "dist/publish"
          $setupDir = "dist/setup"
          New-Item -ItemType Directory -Path $setupDir -Force | Out-Null

          $exePath = (Resolve-Path (Join-Path $publishDir "ArborGraph.exe")).Path
          if (-not (Test-Path $exePath)) {
            throw "Source executable not found at $exePath"
          }

          $installerBaseName = "ArborGraph-Setup-$tag-x64"
          $issPath = "installer/installer.iss"

          Write-Host "Compiling Inno Setup installer for version $ver ($tag)..."
          iscc /DMyAppVersion="$ver" /DSourceExe="$exePath" /O"$setupDir" /F"$installerBaseName" "$issPath"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed with exit code $LASTEXITCODE"
          }

          $setupExePath = Join-Path $setupDir "$installerBaseName.exe"
          if (-not (Test-Path $setupExePath)) {
            throw "Generated installer executable not found at $setupExePath"
          }

          $setupItem = Get-Item $setupExePath
          if ($setupItem.Length -le 1048576) {
            throw "Generated installer is suspiciously small ($($setupItem.Length) bytes). Expected > 1 MB."
          }

          $sizeMb = [math]::Round($setupItem.Length / 1048576, 2)
          Write-Host "Successfully generated installer: $setupExePath ($sizeMb MB / $($setupItem.Length) bytes)"

      - name: Package Release Artifacts & Generate Checksums
        shell: pwsh
        run: |
          $ver = "${{ steps.version_info.outputs.version }}"
          $tag = "${{ steps.version_info.outputs.tag }}"
          $publishDir = "dist/publish"
          $setupDir = "dist/setup"
          $releaseDir = "dist/release_artifacts"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null

          # Copy standalone executable
          $exePath = Join-Path $publishDir "ArborGraph.exe"
          if (-not (Test-Path $exePath)) {
            throw "Compiled executable not found at $exePath"
          }
          Copy-Item -Path $exePath -Destination (Join-Path $releaseDir "ArborGraph.exe")

          # Create portable ZIP archives
          $zipPath = Join-Path $releaseDir "ArborGraph.zip"
          $versionedZipPath = Join-Path $releaseDir "ArborGraph-$tag-portable.zip"
          Compress-Archive -Path $exePath -DestinationPath $zipPath -Force
          Copy-Item -Path $zipPath -Destination $versionedZipPath

          # Copy and verify Windows Installer executable
          $installerName = "ArborGraph-Setup-$tag-x64.exe"
          $setupSrcPath = Join-Path $setupDir $installerName
          if (-not (Test-Path $setupSrcPath)) {
            throw "Installer executable not found at $setupSrcPath"
          }
          $setupDestPath = Join-Path $releaseDir $installerName
          Copy-Item -Path $setupSrcPath -Destination $setupDestPath

          $setupItem = Get-Item $setupDestPath
          if ($setupItem.Length -le 1048576) {
            throw "Installer artifact is suspiciously small ($($setupItem.Length) bytes). Expected > 1 MB."
          }

          # Compute SHA-256 Checksums
          $exeHash = (Get-FileHash (Join-Path $releaseDir "ArborGraph.exe") -Algorithm SHA256).Hash.ToUpper()
          $zipHash = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToUpper()
          $setupHash = (Get-FileHash $setupDestPath -Algorithm SHA256).Hash.ToUpper()

          $manifestLines = @(
            "$exeHash *ArborGraph.exe",
            "$zipHash *ArborGraph.zip",
            "$setupHash *$installerName"
          )
          $manifestPath = Join-Path $releaseDir "SHA256SUMS.txt"
          Set-Content -Path $manifestPath -Value $manifestLines -Encoding Ascii

          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content $manifestPath

      - name: Validate Release Artifacts & Checksums
        shell: pwsh
        run: |
          $tag = "${{ steps.version_info.outputs.tag }}"
          $releaseDir = "dist/release_artifacts"
          $setupExe = "ArborGraph-Setup-$tag-x64.exe"

          $expectedFiles = @(
            "ArborGraph.exe",
            "ArborGraph.zip",
            "ArborGraph-$tag-portable.zip",
            $setupExe,
            "SHA256SUMS.txt"
          )

          Write-Host "Verifying existence and size of all expected release assets..."
          foreach ($f in $expectedFiles) {
            $fullPath = Join-Path $releaseDir $f
            if (-not (Test-Path $fullPath)) {
              throw "Validation failed: Expected asset '$f' was not found at $fullPath"
            }
            $item = Get-Item $fullPath
            if ($item.Length -le 0) {
              throw "Validation failed: Asset '$f' has zero file size."
            }
            if ($f -eq $setupExe -and $item.Length -le 1048576) {
              throw "Validation failed: Installer executable '$f' is suspiciously small ($($item.Length) bytes, expected > 1 MB)."
            }
            $sizeMb = [math]::Round($item.Length / 1048576, 2)
            Write-Host "  [OK] $f ($sizeMb MB / $($item.Length) bytes)"
          }

          # Checksum Manifest Round-Trip Verification
          $manifestPath = Join-Path $releaseDir "SHA256SUMS.txt"
          $manifestContent = Get-Content $manifestPath
          if (-not $manifestContent) {
            throw "Validation failed: SHA256SUMS.txt is empty."
          }

          $trackedAssets = @(
            "ArborGraph.exe",
            "ArborGraph.zip",
            $setupExe
          )

          $parsedEntries = @{}
          foreach ($line in $manifestContent) {
            $trimmed = $line.Trim()
            if (-not $trimmed) { continue }
            if ($trimmed -match '^([a-fA-F0-9]{64})\s+\*?(.+)$') {
              $hash = $matches[1].ToUpper()
              $filename = $matches[2].Trim()
              $parsedEntries[$filename] = $hash
            } else {
              throw "Validation failed: Malformed line in SHA256SUMS.txt: '$trimmed'"
            }
          }

          foreach ($asset in $trackedAssets) {
            if (-not $parsedEntries.ContainsKey($asset)) {
              throw "Validation failed: SHA256SUMS.txt is missing an entry for required tracked asset '$asset'."
            }
            $filePath = Join-Path $releaseDir $asset
            $actualHash = (Get-FileHash $filePath -Algorithm SHA256).Hash.ToUpper()
            $manifestHash = $parsedEntries[$asset]
            if ($actualHash -ne $manifestHash) {
              throw "Validation failed: SHA-256 mismatch for '$asset'! Manifest: $manifestHash, Actual: $actualHash"
            }
            Write-Host "  [VERIFIED] $asset -> $actualHash"
          }
          Write-Host "All release assets and cryptographic checksums verified cleanly!"

      - name: Upload Dry-Run Packaging Artifacts
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.publish == false || inputs.publish == 'false' || inputs.publish == '') }}
        uses: actions/upload-artifact@v4
        with:
          name: arborgraph-${{ steps.version_info.outputs.tag }}-dry-run-artifacts
          path: |
            dist/release_artifacts/ArborGraph.exe
            dist/release_artifacts/ArborGraph.zip
            dist/release_artifacts/ArborGraph-${{ steps.version_info.outputs.tag }}-portable.zip
            dist/release_artifacts/ArborGraph-Setup-${{ steps.version_info.outputs.tag }}-x64.exe
            dist/release_artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && (inputs.publish == true || inputs.publish == 'true')) }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version_info.outputs.tag }}"
          $title = "ArborGraph $tag"
          $releaseDir = "dist/release_artifacts"

          $notesFile = "dist/RELEASE_NOTES_$tag.md"
          $notesArg = @()
          if (Test-Path $notesFile) {
            $notesArg = @("--notes-file", $notesFile)
          } else {
            $notesArg = @("--generate-notes")
          }

          $assets = @(
            (Join-Path $releaseDir "ArborGraph.exe"),
            (Join-Path $releaseDir "ArborGraph.zip"),
            (Join-Path $releaseDir "ArborGraph-$tag-portable.zip"),
            (Join-Path $releaseDir "ArborGraph-Setup-$tag-x64.exe"),
            (Join-Path $releaseDir "SHA256SUMS.txt")
          )

          # If release already exists, upload assets to it; otherwise create it
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag exists. Uploading assets with clobber..."
            gh release upload $tag $assets --clobber
          } else {
            Write-Host "Creating release $tag..."
            gh release create $tag $assets --title $title @notesArg
          }
