<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <!-- ArborGraph: Hierarchical Tree & Graph Nodes Identity -->
  <!-- Container / Background Badge -->
  <rect x="2" y="2" width="44" height="44" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>

  <!-- Connecting Edges (Tree Branches & Graph Relationships) -->
  <!-- Root to Mid-Tier Branches -->
  <line x1="24" y1="36" x2="14" y2="24" stroke="#005FB8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="24" y1="36" x2="24" y2="22" stroke="#005FB8" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="24" y1="36" x2="34" y2="24" stroke="#005FB8" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Mid-Tier to Upper Leaf Branches -->
  <line x1="14" y1="24" x2="10" y2="12" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="14" y1="24" x2="18" y2="12" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="24" y1="22" x2="24" y2="10" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="24" x2="30" y2="12" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="34" y1="24" x2="38" y2="12" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Horizontal Relational Graph Cross-Link (Graph Concept) -->
  <line x1="14" y1="24" x2="34" y2="24" stroke="#475569" stroke-width="1.2" stroke-dasharray="2 2" stroke-linecap="round"/>

  <!-- Level 3 Leaf Nodes (Top Tier) -->
  <circle cx="10" cy="12" r="2.4" fill="#38BDF8"/>
  <circle cx="18" cy="12" r="2.4" fill="#38BDF8"/>
  <circle cx="24" cy="10" r="2.8" fill="#38BDF8"/>
  <circle cx="30" cy="12" r="2.4" fill="#38BDF8"/>
  <circle cx="38" cy="12" r="2.4" fill="#38BDF8"/>

  <!-- Level 2 Interior Nodes (Mid Tier) -->
  <circle cx="14" cy="24" r="3.2" fill="#0EA5E9" stroke="#0F172A" stroke-width="1"/>
  <circle cx="24" cy="22" r="3.4" fill="#0EA5E9" stroke="#0F172A" stroke-width="1"/>
  <circle cx="34" cy="24" r="3.2" fill="#0EA5E9" stroke="#0F172A" stroke-width="1"/>

  <!-- Level 1 Root Node (Bottom Anchor) -->
  <circle cx="24" cy="36" r="4.2" fill="#FFFFFF" stroke="#005FB8" stroke-width="2"/>
</svg>
