<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" width="48" height="48">
  <defs>
    <linearGradient id="scopeGrad" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="radarSweep" cx="24" cy="24" r="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#0EA5E9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Disk Platter Ring -->
  <circle cx="24" cy="24" r="21" stroke="url(#scopeGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Radar / Scanner Sweep Sector -->
  <path d="M24 24 L38.8 9.2 A21 21 0 0 1 45 24 Z" fill="url(#radarSweep)"/>

  <!-- Concentric Inner Storage Track -->
  <circle cx="24" cy="24" r="14" stroke="#7DD3FC" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.85"/>

  <!-- Inner Platter Aperture Ring -->
  <circle cx="24" cy="24" r="7.5" stroke="#BAE6FD" stroke-width="1.8"/>

  <!-- Center Precision Optical Hub -->
  <circle cx="24" cy="24" r="3.2" fill="#FFFFFF"/>

  <!-- Precision Scope Crosshairs (Top, Bottom, Left, Right) -->
  <line x1="24" y1="1" x2="24" y2="7" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="41" x2="24" y2="47" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="1" y1="24" x2="7" y2="24" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <line x1="41" y1="24" x2="47" y2="24" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>

  <!-- Scope Corner Calibration Brackets -->
  <path d="M12 8 L8 8 L8 12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M36 8 L40 8 L40 12" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M12 40 L8 40 L8 36" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <path d="M36 40 L40 40 L40 36" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
