name: ArborGraph Automated QA & Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & Automated QA
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Project Dependencies
        run: |
          dotnet restore DiskScope.csproj
          dotnet restore tests/DiskScope.Tests.csproj

      - name: Build Application & Test Suites
        run: |
          dotnet build DiskScope.csproj -c Release --no-restore
          dotnet build tests/DiskScope.Tests.csproj -c Release --no-restore

      - name: Run 30-Stage Automated Regression Suite
        run: |
          dotnet run --project tests/DiskScope.Tests.csproj -c Release --no-build

      - name: Run Security & Data-Safety Audits
        run: |
          dotnet run --project tests/DiskScope.Tests.csproj -c Release --no-build -- --security
